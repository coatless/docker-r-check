FLAVOR_ID=gcc-ubsan
FLAVOR_TITLE="GCC UndefinedBehaviourSanitizer (gcc-UBSAN)"
CRAN_ISSUE_KIND="gcc-UBSAN"
CRAN_HOST_OS="Fedora (Ripley)"
TIER=1
STATUS=experimental
REFERENCE="R Installation and Administration manual, 'Using Undefined Behaviour Sanitizer'; https://www.stats.ox.ac.uk/pub/bdr/memtests/"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS=""
R_BUILD_METHOD=configure
R_CONFIGURE_ARGS=""
R_CC="gcc -fsanitize=undefined,bounds-strict -fno-sanitize=float-divide-by-zero -fno-omit-frame-pointer"
R_CXX="g++ -fsanitize=undefined,bounds-strict -fno-sanitize=float-divide-by-zero -fno-omit-frame-pointer"
R_FC="gfortran -fsanitize=undefined"
R_CFLAGS="-g -O2 -Wall -pedantic"
R_CXXFLAGS="-g -O2 -Wall -pedantic"
R_FFLAGS="-g -O2"
R_LDFLAGS=""
R_MAIN_LDFLAGS="-fsanitize=undefined"

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV="
UBSAN_OPTIONS=print_stacktrace=1
"
CHECK_EXTRA_ARGS=""

NOTES="-fno-sanitize=float-divide-by-zero is not optional: R's arithmetic
relies on IEC 60559 semantics where division by zero yields Inf, so without this
exclusion every well-behaved R session reports undefined behaviour and the
signal is lost.

bounds-strict is included because CRAN's gcc-UBSAN is the check that catches
out-of-bounds access on array members, which plain -fsanitize=undefined misses.
It is GCC-only, which is one of the reasons CRAN runs gcc-UBSAN and clang-UBSAN
as separate issue kinds rather than treating them as interchangeable.

UBSAN reports are runtime diagnostics printed to stderr, not failures: a package
can emit undefined-behaviour reports and still exit 0, so R CMD check will say
OK. The result summariser therefore has to scan the check output for the
sanitizer's own report lines rather than trusting the Status: line -- see
tools/summarise-check.awk. This is the single most important difference between
reading a sanitizer flavor's result and reading an ordinary one.

FIDELITY GAP: CRAN runs this on Fedora; this image is Debian, so GCC versions
and therefore the exact set of enabled sub-sanitizers may differ."
