FLAVOR_ID=debian-gcc
FLAVOR_TITLE="Debian unstable, system GCC, reference build"
CRAN_ISSUE_KIND=""
CRAN_HOST_OS="Debian testing (Hornik)"
TIER=1
STATUS=implemented
REFERENCE="https://cran.r-project.org/web/checks/check_flavors.html"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS=""
R_BUILD_METHOD=cran-qa
R_CONFIGURE_ARGS=""
R_CC=""
R_CXX=""
R_FC=""
R_CFLAGS=""
R_CXXFLAGS=""
R_FFLAGS=""
R_LDFLAGS=""
R_MAIN_LDFLAGS=""

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV=""
CHECK_EXTRA_ARGS=""

NOTES="Control flavor. Reproduces no additional issue kind; it is the baseline a
flavor result is diffed against to tell 'this package is broken' apart from
'this package is broken *under this instrumentation*'. Every evaluation run
should include it -- see docs/evaluation-protocol.md.

This is the configuration the upstream README documents as working, unchanged
except for the flavor plumbing, and it is the only path that uses CRAN's own
build-R script with no compiler overrides."
