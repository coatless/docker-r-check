NOTES="Demoted to Tier 3 on the strength of prior art rather than on effort:
the r-hub containers project documents that an ATLAS build on Ubuntu does not
reproduce CRAN's ATLAS issues, and that they had to move to Fedora to get
agreement. There is no reason to expect Debian to behave differently from
Ubuntu here.

Debian's libatlas-base-dev is moreover a generic, non-tuned ATLAS build, whereas
ATLAS's whole design is to tune itself to the machine it was built on. That is
irreconcilable with reproducibility as this project defines it, and it is
probably the underlying reason the r-hub build disagreed with CRAN's.

Left in the tree, buildable, and deliberately marked Tier 3: it costs almost
nothing to keep, and if the Fedora family lands (docs/architecture.md ADR-0005)
this file is the starting point. It should not be included in any published
agreement rate until then."
