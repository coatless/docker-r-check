FLAVOR_ID=clang-ubsan
FLAVOR_TITLE="clang UndefinedBehaviourSanitizer with libc++ (clang-UBSAN)"
CRAN_ISSUE_KIND="clang-UBSAN"
CRAN_HOST_OS="Ubuntu with libc++ (Ripley)"
TIER=1
STATUS=experimental
REFERENCE="R Installation and Administration manual, 'Using Undefined Behaviour Sanitizer'; https://www.stats.ox.ac.uk/pub/bdr/memtests/"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS="clang libc++-dev libc++abi-dev libomp-dev"
R_BUILD_METHOD=configure
R_CONFIGURE_ARGS=""
R_CC="clang -fsanitize=undefined -fno-sanitize=float-divide-by-zero -fno-omit-frame-pointer"
R_CXX="clang++ -stdlib=libc++ -fsanitize=undefined -fno-sanitize=float-divide-by-zero -fno-omit-frame-pointer"
R_FC="gfortran"
R_CFLAGS="-g -O2 -Wall -pedantic"
R_CXXFLAGS="-g -O2 -Wall -pedantic"
R_FFLAGS="-g -O2"
R_LDFLAGS=""
R_MAIN_LDFLAGS="-fsanitize=undefined"

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV="
UBSAN_OPTIONS=print_stacktrace=1
"
CHECK_EXTRA_ARGS=""

NOTES="No bounds-strict here, unlike gcc-ubsan: it is a GCC extension. What
clang adds instead is a more thorough set of C++ checks under libc++.

-fsanitize=vptr is left at clang's default rather than being disabled. It is
the check most likely to fire on packages using C++ polymorphism across
translation units, and it is a real finding when it does; if it turns out to
produce false positives against libc++ built without RTTI it should be
disabled here and the reason recorded, not disabled silently.

As with gcc-ubsan, UBSAN findings do not change the exit status, so the result
summariser scans for the sanitizer's report lines rather than trusting Status:.

FIDELITY GAPS: same as clang-asan -- Debian rather than CRAN's Ubuntu, and the
libc++ decision is inferred (docs/open-questions.md Q2)."
