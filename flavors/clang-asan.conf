FLAVOR_ID=clang-asan
FLAVOR_TITLE="clang AddressSanitizer with libc++ (clang-ASAN)"
CRAN_ISSUE_KIND="clang-ASAN"
CRAN_HOST_OS="Ubuntu with libc++ (Ripley)"
TIER=1
STATUS=experimental
REFERENCE="R Installation and Administration manual, 'Using Address Sanitizer'; https://www.stats.ox.ac.uk/pub/bdr/memtests/"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS="clang libc++-dev libc++abi-dev libomp-dev"
R_BUILD_METHOD=configure
R_CONFIGURE_ARGS=""
R_CC="clang -fsanitize=address -fno-omit-frame-pointer"
R_CXX="clang++ -stdlib=libc++ -fsanitize=address -fno-omit-frame-pointer"
R_FC="gfortran"
R_CFLAGS="-g -O2 -Wall -pedantic"
R_CXXFLAGS="-g -O2 -Wall -pedantic"
R_FFLAGS="-g -O2"
R_LDFLAGS=""
R_MAIN_LDFLAGS="-fsanitize=address"

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV="
ASAN_OPTIONS=detect_leaks=0:detect_odr_violation=0
"
CHECK_EXTRA_ARGS=""

NOTES="clang-ASAN exists as a CRAN issue kind separate from gcc-ASAN mainly
because of libc++: checking C++ code against a second standard library
implementation catches assumptions that libstdc++ happens to tolerate. That is
why -stdlib=libc++ is set here even though it is the riskiest single setting in
this file -- dropping it would make this flavor a near-duplicate of gcc-asan
and worth much less.

R_FC is plain gfortran with no sanitizer flag, unlike gcc-asan. Instrumenting
Fortran with GCC's libasan while C/C++ use LLVM's compiler-rt ASAN links two
different sanitizer runtimes into one process, which typically aborts at
startup. The cost is that Fortran code is not instrumented in this flavor;
gcc-asan covers it.

FIDELITY GAPS:
 - CRAN runs clang-ASAN on Ubuntu; this image is Debian unstable, so the clang
   version will usually be newer than CRAN's and may report more.
 - Whether CRAN's clang-ASAN build uses -stdlib=libc++ for package code as well
   as for R itself is inferred, not confirmed -- docs/open-questions.md Q2.
 - Packages linking system C++ libraries built against libstdc++ can fail to
   link at all here. Such a failure is a flavor artefact, not a package bug,
   and must be excluded from the agreement rate rather than counted as a
   disagreement."
