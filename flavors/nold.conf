FLAVOR_ID=nold
FLAVOR_TITLE="R built without long double (noLD)"
CRAN_ISSUE_KIND="noLD"
CRAN_HOST_OS="Ubuntu (Ripley)"
TIER=1
STATUS=experimental
REFERENCE="https://www.stats.ox.ac.uk/pub/bdr/noLD/README.txt"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS=""
R_BUILD_METHOD=configure
R_CONFIGURE_ARGS="--disable-long-double"
R_CC=""
R_CXX=""
R_FC=""
R_CFLAGS="-g -O2 -Wall -pedantic"
R_CXXFLAGS="-g -O2 -Wall -pedantic"
R_FFLAGS="-g -O2"
R_LDFLAGS=""
R_MAIN_LDFLAGS=""

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV=""
CHECK_EXTRA_ARGS=""

NOTES="Highest value-per-unit-effort of the Tier 1 set: it needs no sanitizer
runtime, no suppression lists and no slowdown, yet it surfaces a whole class of
real bugs (tests whose tolerances only pass because 80-bit x87 long doubles
flattered them).

Because it changes numerical results rather than instrumenting memory, noLD is
also the flavor where cross-host agreement is *least* guaranteed: results depend
on the C library's long-double-free code paths and on the CPU. Do not report a
noLD agreement rate without also reporting the per-host breakdown.

Uses R_BUILD_METHOD=configure: --disable-long-double must reach configure, and
CRAN's build-R script drives its own configure invocation."
