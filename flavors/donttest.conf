FLAVOR_ID=donttest
FLAVOR_TITLE="Check running \\donttest examples"
CRAN_ISSUE_KIND="donttest"
CRAN_HOST_OS="Ubuntu (Ripley)"
TIER=1
STATUS=experimental
REFERENCE="https://www.stats.ox.ac.uk/pub/bdr/donttest/README.txt"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS=""
R_BUILD_METHOD=cran-qa
R_CONFIGURE_ARGS=""
R_CC=""
R_CXX=""
R_FC=""
R_CFLAGS=""
R_CXXFLAGS=""
R_FFLAGS=""
R_LDFLAGS=""
R_MAIN_LDFLAGS=""

CHECK_RENVIRON="
_R_CHECK_DONTTEST_EXAMPLES_=true
"
CHECK_RUNTIME_ENV=""
CHECK_EXTRA_ARGS=""

NOTES="Configured entirely through _R_CHECK_DONTTEST_EXAMPLES_ rather than
through the --run-donttest command line option, deliberately: the environment
variable is read by R CMD check itself, so it works no matter how the
surrounding CRAN QA driver script invokes the check, whereas an extra command
line argument depends on that driver forwarding unknown options.

\\donttest examples are the examples maintainers marked as too slow or too
network-dependent for routine checking, so this flavor is the most likely of the
Tier 1 set to produce non-reproducible failures: it will run code that reaches
the network. Treat network-caused failures as inconclusive rather than as
disagreement with CRAN when computing the agreement rate."
