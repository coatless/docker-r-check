FLAVOR_ID=gcc-asan
FLAVOR_TITLE="GCC AddressSanitizer (gcc-ASAN)"
CRAN_ISSUE_KIND="gcc-ASAN"
CRAN_HOST_OS="Fedora (Ripley)"
TIER=1
STATUS=experimental
REFERENCE="R Installation and Administration manual, 'Using Address Sanitizer'; https://www.stats.ox.ac.uk/pub/bdr/memtests/"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS=""
R_BUILD_METHOD=configure
R_CONFIGURE_ARGS=""
R_CC="gcc -fsanitize=address -fno-omit-frame-pointer"
R_CXX="g++ -fsanitize=address -fno-omit-frame-pointer"
R_FC="gfortran -fsanitize=address"
R_CFLAGS="-g -O2 -Wall -pedantic"
R_CXXFLAGS="-g -O2 -Wall -pedantic"
R_FFLAGS="-g -O2"
R_LDFLAGS=""
R_MAIN_LDFLAGS="-fsanitize=address"

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV="
ASAN_OPTIONS=detect_leaks=0:detect_odr_violation=0
"
CHECK_EXTRA_ARGS=""

NOTES="The sanitizer flags live in R_CC/R_CXX rather than in R_CFLAGS on
purpose. R records the compiler *command* at configure time and R CMD INSTALL
reuses it, so putting -fsanitize=address in the driver is what makes package C
and C++ code instrumented too; a package that overrides CFLAGS in its own
Makevars would otherwise silently drop the instrumentation.

CFLAGS deliberately omit the -mtune=native that the R-admin manual's example
uses. -mtune=native makes the build depend on the CPU of whatever host built it,
which is precisely the property this project exists to eliminate. Keeping a
fixed baseline costs a little performance and buys cross-host reproducibility.

detect_leaks=0 because R leaks by design at exit and LeakSanitizer is on by
default for GCC ASAN; leaving it on drowns the real findings.

FIDELITY GAPS, both flagged for validation before any agreement rate is
published (docs/evaluation-protocol.md):
 - CRAN runs gcc-ASAN on Fedora, this image is Debian. Different libc, different
   system library versions, therefore potentially different findings inside
   uninstrumented system code.
 - gfortran's ASAN runtime and the C/C++ one are both GCC's here, so this
   flavor does not have the cross-runtime mixing problem clang-asan has.
 - No suppression file is shipped yet. CRAN's published results are filtered by
   Ripley's judgement; ours are not, so expect more raw output than CRAN shows."
