FLAVOR_ID=mkl
FLAVOR_TITLE="R linked against Intel MKL"
CRAN_ISSUE_KIND="MKL"
CRAN_HOST_OS="Fedora (Ripley)"
TIER=3
STATUS=planned
REFERENCE="https://www.stats.ox.ac.uk/pub/bdr/MKL/README.txt"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main contrib non-free"

R_BUILD_SYSDEPS="intel-mkl"
R_BUILD_METHOD=cran-qa
R_CONFIGURE_ARGS=""
R_CC=""
R_CXX=""
R_FC=""
R_CFLAGS=""
R_CXXFLAGS=""
R_FFLAGS=""
R_LDFLAGS=""
R_MAIN_LDFLAGS=""

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV="
MKL_NUM_THREADS=1
OMP_NUM_THREADS=1
"
CHECK_EXTRA_ARGS=""

NOTES="STATUS=planned, not experimental: this flavor is declared for the record
and is not expected to build as written.

Two blockers, both of which are decisions for the project owner rather than
engineering problems:

 1. Licensing. Debian's intel-mkl is in non-free, so APT_COMPONENTS has to
    enable non-free, and the resulting image cannot be redistributed on the same
    terms as the others. Publishing an MKL image to a public registry is a
    licence question, not a build question -- docs/open-questions.md Q7.
 2. Fidelity. CRAN's MKL check uses Intel's own oneAPI distribution on Fedora,
    which is a different MKL from Debian's packaged one.

Declared anyway because leaving it out would misrepresent the coverage: MKL is
one of the additional issue kinds, and a reader comparing this repository
against CRAN's list deserves to see why it is absent rather than to find a gap."
