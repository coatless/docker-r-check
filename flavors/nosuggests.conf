FLAVOR_ID=nosuggests
FLAVOR_TITLE="Check with suggested packages unavailable (noSuggests)"
CRAN_ISSUE_KIND="noSuggests"
CRAN_HOST_OS="Fedora (Ripley)"
TIER=1
STATUS=experimental
REFERENCE="https://www.stats.ox.ac.uk/pub/bdr/noSuggests/README.txt"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS=""
R_BUILD_METHOD=cran-qa
R_CONFIGURE_ARGS=""
R_CC=""
R_CXX=""
R_FC=""
R_CFLAGS=""
R_CXXFLAGS=""
R_FFLAGS=""
R_LDFLAGS=""
R_MAIN_LDFLAGS=""

CHECK_RENVIRON="
_R_CHECK_FORCE_SUGGESTS_=false
_R_CHECK_SUGGESTS_ONLY_=true
"
CHECK_RUNTIME_ENV=""
CHECK_EXTRA_ARGS=""

NOTES="Cheapest flavor to run and the one most often misread by maintainers:
the failure is almost never 'the package is broken', it is 'the package uses a
suggested package without guarding for its absence', which R CMD check only
notices when the package genuinely is absent.

_R_CHECK_SUGGESTS_ONLY_=true makes R CMD check itself behave as if only
Depends/Imports/LinkingTo were installed, and _R_CHECK_FORCE_SUGGESTS_=false
stops a missing Suggests from being an error in its own right. Together these
are the part of the flavor we control directly.

FIDELITY GAP: full fidelity additionally requires that the suggested packages
are not installed in the library at all, and in this pipeline the dependency
install is performed by CRAN's check_CRAN_incoming, whose option handling we
have not been able to read (the QA SVN tree is fetched at image build time).
Until that is confirmed -- docs/open-questions.md Q4 -- this flavor reproduces
noSuggests at the R CMD check level but not necessarily at the library level,
and a package that inspects installed.packages() directly could still diverge
from CRAN's verdict."
