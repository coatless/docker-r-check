FLAVOR_ID=openblas
FLAVOR_TITLE="R linked against OpenBLAS"
CRAN_ISSUE_KIND="OpenBLAS"
CRAN_HOST_OS="Fedora (Ripley)"
TIER=2
STATUS=implemented
REFERENCE="https://www.stats.ox.ac.uk/pub/bdr/OpenBLAS/README.txt"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS="libopenblas-dev"
R_BUILD_METHOD=cran-qa
R_CONFIGURE_ARGS=""
R_CC=""
R_CXX=""
R_FC=""
R_CFLAGS=""
R_CXXFLAGS=""
R_FFLAGS=""
R_LDFLAGS=""
R_MAIN_LDFLAGS=""

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV="
OPENBLAS_NUM_THREADS=1
OMP_NUM_THREADS=1
"
CHECK_EXTRA_ARGS=""

NOTES="This is the configuration the upstream README used as its worked
example, so it is the flavor most likely to work unchanged.

OPENBLAS_NUM_THREADS=1 is set deliberately. OpenBLAS picks its thread count from
the host CPU, and multi-threaded reductions sum in a non-deterministic order, so
an unpinned OpenBLAS gives different last-digit results on a 4-core laptop and a
64-core server. Pinning to one thread costs wall-clock time and buys the
cross-host determinism that is the point of this project. A package whose result
depends on the thread count is itself a finding, but it should be found
deliberately rather than as noise in every other check."
