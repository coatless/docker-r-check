FLAVOR_ID=valgrind
FLAVOR_TITLE="valgrind memcheck"
CRAN_ISSUE_KIND="valgrind"
CRAN_HOST_OS="Fedora (Ripley)"
TIER=2
STATUS=experimental
REFERENCE="R Installation and Administration manual, 'Using valgrind'; https://www.stats.ox.ac.uk/pub/bdr/memtests/"

BASE_FAMILY=debian
BASE_IMAGE=docker.io/debian
BASE_TAG=unstable
APT_COMPONENTS="main"

R_BUILD_SYSDEPS="valgrind"
R_BUILD_METHOD=configure
R_CONFIGURE_ARGS="--with-valgrind-instrumentation=2"
R_CC=""
R_CXX=""
R_FC=""
R_CFLAGS="-g -O2 -Wall -pedantic"
R_CXXFLAGS="-g -O2 -Wall -pedantic"
R_FFLAGS="-g -O2"
R_LDFLAGS=""
R_MAIN_LDFLAGS=""

CHECK_RENVIRON=""
CHECK_RUNTIME_ENV=""
CHECK_EXTRA_ARGS="--use-valgrind"

NOTES="Tier 2 rather than Tier 1 for two independent reasons.

First, cost: valgrind runs the whole program on a synthetic CPU, typically
10-50x slower. That is affordable for one package on demand -- which is the use
case this project targets -- and unaffordable for a sweep.

Second, and more importantly, this is the one Tier 1/2 flavor that cannot be
configured through the environment. Every other flavor reaches R CMD check
through config.site at build time or ~/.R/check.Renviron at check time, both of
which R reads natively. valgrind needs the --use-valgrind command line option,
so CHECK_EXTRA_ARGS has to be forwarded by CRAN's check_CRAN_incoming driver,
and we have not confirmed that it forwards unknown options
(docs/open-questions.md Q4). Until that is confirmed this flavor's R build is
correct but the check may silently run without valgrind, which would look like
perfect agreement with CRAN while testing nothing. rcheck therefore refuses to
report a valgrind verdict unless the check log shows valgrind actually ran --
see tools/summarise-check.awk.

--with-valgrind-instrumentation=2 makes R tell valgrind about its own allocator
so that uninitialised R vectors are detected. Without it valgrind sees R's
memory pools as one large initialised block and misses most of what CRAN's
valgrind check exists to find."
