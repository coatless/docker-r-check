name: evaluate

# Check CRAN's current BLAS and clang23 issues in the arm that matches each
# one, with the reference arm as the control, plus a fixed set of other
# packages in every arm. All arms use the same R and QA revisions and the
# same dated CRAN snapshot, and the report compares the results with CRAN's
# own logs.
#
# A run takes hours, so it starts only when the branch `evaluate` is pushed,
# for example with `git push origin HEAD:evaluate`. eval/run.env says which
# kinds and jobs to run.

on:
  push:
    branches: [evaluate]
  workflow_dispatch:
    inputs:
      kinds:
        description: CRAN issue kinds to run, in place of KINDS in eval/run.env
      only:
        description: Job labels to run, in place of ONLY in eval/run.env

permissions:
  contents: read

env:
  # Small packages of different kinds: C, more C, Fortran, C calling the
  # BLAS, saved test output that depends on the BLAS, and knitr vignettes.
  OTHER_PACKAGES: base64enc digest quadprog irlba maxLik jsonlite

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      r_rev: ${{ steps.pin.outputs.r_rev }}
      qa_rev: ${{ steps.pin.outputs.qa_rev }}
      snapshot: ${{ steps.pin.outputs.snapshot }}
      matrix: ${{ steps.arms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: read what to run
        env:
          IN_KINDS: ${{ inputs.kinds }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          . eval/run.env
          {
            echo "KINDS=${IN_KINDS:-$KINDS}"
            echo "ONLY=${IN_ONLY:-$ONLY}"
          } | tee -a "$GITHUB_ENV"

      - name: pin the revisions and the snapshot for every arm
        id: pin
        run: |
          r_rev=$(curl -fsSL https://svn.r-project.org/R/trunk/ | sed -n 's/.*Revision \([0-9][0-9]*\).*/\1/p' | head -n 1)
          qa_rev=$(curl -fsSL https://svn.r-project.org/R-dev-web/trunk/CRAN/QA/Kurt/ | sed -n 's/.*Revision \([0-9][0-9]*\).*/\1/p' | head -n 1)
          snapshot=$(date -u -d '1 day ago' +%Y-%m-%d)
          [ -n "$r_rev" ] && [ -n "$qa_rev" ]
          {
            echo "r_rev=$r_rev"
            echo "qa_rev=$qa_rev"
            echo "snapshot=$snapshot"
          } | tee -a "$GITHUB_OUTPUT"

      - name: save CRAN's current issues and their logs
        env:
          R_REV: ${{ steps.pin.outputs.r_rev }}
          QA_REV: ${{ steps.pin.outputs.qa_rev }}
          SNAPSHOT: ${{ steps.pin.outputs.snapshot }}
        run: |
          set -o pipefail
          mkdir -p oracle/logs
          cd oracle
          curl -fsSL -D rds.headers -o check_issues.rds https://cran.r-project.org/web/checks/check_issues.rds
          curl -fsSL -o README.txt https://www.stats.ox.ac.uk/pub/bdr/Rblas/README.txt
          docker run --rm --user "$(id -u):$(id -g)" -e KINDS -v "$GITHUB_WORKSPACE:/w" -w /w/oracle \
            docker.io/library/r-base:latest Rscript /w/eval/targets.R
          tail -n +2 targets.tsv | while IFS=$'\t' read -r pkg _ kind href _ log install; do
            curl -fsSL -o "$log" "$href" || echo "could not fetch $href ($pkg, $kind)"
            if [ "$install" != - ]; then
              curl -fsSL --max-filesize 3000000 -o "${log%.out}.install.log" "$install" ||
                echo "did not keep $install (too large or missing)"
            fi
          done
          {
            echo "R-revision: $R_REV"
            echo "QA-revision: $QA_REV"
            echo "CRAN-snapshot: $SNAPSHOT"
            echo "check_issues-Last-Modified: $(sed -n 's/^[Ll]ast-[Mm]odified: //p' rds.headers | tr -d '\r')"
            echo "Fetched: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > run.txt
          cat run.txt
          cut -f1-3,5 targets.tsv | column -t -s $'\t' 

      - name: choose the arms
        id: arms
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_OUTPUT"
          import csv, json, math, os
          count = {}
          for row in csv.DictReader(open("oracle/targets.tsv"), delimiter="\t"):
              count[row["arm"]] = count.get(row["arm"], 0) + 1
          jobs = [{"arm": "reference", "targets": "reference", "label": "reference", "shard": 1, "shards": 1}]
          # Arms with nothing on CRAN's list today still check the other packages.
          for arm in ("openblas", "mkl", "atlas"):
              count.setdefault(arm, 0)
          for arm in sorted(count):
              # A long list is split over several jobs of about 10 packages.
              shards = max(1, min(10, math.ceil(count[arm] / 10)))
              if arm != "blis":
                  jobs += [{"arm": arm, "targets": arm, "label": arm, "shard": s, "shards": shards}
                           for s in range(1, shards + 1)]
                  continue
              # CRAN's BLIS is Fedora's 2.0-5. Besides Debian's BLIS, run 2.0 built
              # with Fedora's settings and Fedora's own binary. BLIS picks its
              # kernels from the CPU and the results depend on them, so every job
              # pins the kernel set. skx needs AVX-512, which only some runners
              # have.
              builds = [("blis", "blis"), ("blis20", "blis-2.0"), ("blisfedora", "blis-fedora")]
              jobs += [{"arm": a, "targets": "blis", "label": f"{label}-{k}", "blis_arch": k,
                        "shard": 1, "shards": 1}
                       for a, label in builds for k in ("zen3", "haswell", "skx")]
          only = os.environ.get("ONLY", "").split()
          jobs = [j for j in jobs
                  if not only or j["label"] in only or f'{j["label"]}#{j["shard"]}' in only]
          print("matrix=" + json.dumps({"include": jobs}))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: oracle
          path: oracle/

  check:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      ARM: ${{ matrix.arm }}
      TARGETS: ${{ matrix.targets }}
      LABEL: ${{ matrix.label }}
      BLIS_ARCH_TYPE: ${{ matrix.blis_arch }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
      R_REV: ${{ needs.targets.outputs.r_rev }}
      QA_REV: ${{ needs.targets.outputs.qa_rev }}
      SNAPSHOT: ${{ needs.targets.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: oracle
          path: oracle

      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/lib/jvm /opt/az /opt/microsoft || true
          sudo docker image prune -af || true
          df -h /

      - name: can this runner use the pinned kernels
        run: |
          mkdir -p "out/$LABEL"
          {
            echo "cpu: $(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n 1)"
            echo "cores: $(nproc)"
            echo "memory: $(free -g | awk '/^Mem/ {print $2}') GiB"
            echo "avx512: $(grep -qw avx512f /proc/cpuinfo && echo yes || echo no)"
          } | tee "out/$LABEL/runner.txt"
          if [ "$BLIS_ARCH_TYPE" = skx ] && ! grep -qw avx512f /proc/cpuinfo; then
            echo "this runner's CPU has no AVX-512, so the skx kernels were not run" | tee "out/$LABEL/SKIPPED-$SHARD"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: build the arm
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          # Every build fetches R's recommended packages from CRAN by rsync,
          # and CRAN limits those connections. Do not start all jobs at once.
          sleep $((RANDOM % 600))
          # shellcheck disable=SC1090 # the arm file names its Debian suite
          suite=$(. "docker/flavours/$ARM.env" && echo "$RCC_DEBIAN_TAG")
          if ! docker build --progress=plain --platform linux/amd64 --target standalone \
                 --build-arg DEBIAN_TAG="$suite" --build-arg RCC_FLAVOUR="$ARM" \
                 --build-arg R_SVN_REV="$R_REV" --build-arg QA_SVN_REV="$QA_REV" \
                 --build-arg MAKEFLAGS=-j4 --build-arg BUILD_DATE="$(date -u +%Y-%m-%d)" \
                 -t "rcc-standalone:$ARM" docker/ 2>&1 | tee build.log; then
            tail -n 20 build.log > "out/$LABEL/BUILD-FAILED"
            exit 1
          fi
          {
            docker run --rm --entrypoint cat "rcc-standalone:$ARM" /etc/rcheck/manifest.txt
            echo "cxx: $(docker run --rm --entrypoint /build/bin/R "rcc-standalone:$ARM" CMD config CXX)"
          } | tee "out/$LABEL/manifest.txt"

      - name: check the packages
        if: env.SKIP != '1'
        env:
          CRAN_MIRROR: https://packagemanager.posit.co/cran/${{ needs.targets.outputs.snapshot }}
          RCC_MODE: regular
          OPENBLAS_CORETYPE: Haswell
          # One hour for any one step of a check, so a test that hangs does
          # not use up the job.
          _R_CHECK_ELAPSED_TIMEOUT_: 3600
        run: |
          # reference is the control for every BLAS issue, and for the clang23
          # packages that fail to install at CRAN.
          case "$ARM" in
          reference)
            targets=$(tail -n +2 oracle/targets.tsv | awk -F'\t' '$5 != "clang23" || $7 != "-" {print $1}') ;;
          *)
            targets=$(tail -n +2 oracle/targets.tsv |
              awk -F'\t' -v a="$TARGETS" -v n="$SHARDS" -v k="$SHARD" '$5 == a && i++ % n == k - 1 {print $1}') ;;
          esac
          [ "$SHARD" = 1 ] || OTHER_PACKAGES=""
          curl -fsSL -o PACKAGES "$CRAN_MIRROR/src/contrib/PACKAGES"
          pkgs=""
          # The package lists are split on purpose here and below.
          # shellcheck disable=SC2086
          for p in $(printf '%s\n' $targets $OTHER_PACKAGES | awk '!seen[$0]++'); do
            if grep -qx "Package: $p" PACKAGES; then
              pkgs="$pkgs $p"
            else
              echo "$p is not in the $SNAPSHOT snapshot, so it was not checked" | tee -a "out/$LABEL/SKIPPED-$SHARD"
            fi
          done
          echo "checking in $ARM:$pkgs"
          # Stop the container before the job's time limit, so that the results
          # of the packages it finished are still collected.
          ( sleep $((285 * 60))
            echo "time limit reached, stopping the check container" | tee -a "out/$LABEL/SKIPPED-$SHARD"
            docker ps -q --filter name=rcc-check- | xargs -r docker stop -t 10 ) &
          watchdog=$!
          # shellcheck disable=SC2086
          demo/03-check.sh "$ARM" $pkgs || echo "03-check.sh exited $?"
          kill "$watchdog" 2>/dev/null || true

      - name: keep the logs
        if: always()
        run: |
          [ -d "results/$ARM" ] || exit 0
          for d in results/"$ARM"/*/; do
            p=$(basename "$d")
            [ -f "$d/manifest.dcf" ] || continue
            mkdir -p "out/$LABEL/$p"
            cp "$d/manifest.dcf" "$d/console.log" "out/$LABEL/$p/"
            if [ -d "$d/$p.Rcheck" ]; then
              mkdir -p "out/$LABEL/$p/$p.Rcheck"
              (cd "$d/$p.Rcheck" && find . -maxdepth 2 \( -name '00check.log' -o -name '00install.out' \
                 -o -name '*.Rout' -o -name '*.Rout.fail' -o -name '*.Rout.save' -o -name '*-Ex.Rout' \) \
                 -exec cp --parents {} "$GITHUB_WORKSPACE/out/$LABEL/$p/$p.Rcheck/" \;)
            fi
          done
          cp build.log "out/$LABEL/" 2>/dev/null || true
          du -sh "out/$LABEL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.label }}-${{ matrix.shard }}
          path: out/

  report:
    needs: [targets, check]
    if: always() && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: oracle
          path: oracle

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: out

      - name: compare with CRAN
        run: |
          python3 eval/report.py oracle out | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.md
