name: evaluate

# A one-off on this scratch branch. spatPomp's vec_rmeasure() passes the unit
# number counted from one to C code that counts from zero. This shows what
# that does, with states chosen so that each value can be told apart.

on:
  push:
    branches: [evaluate]

permissions:
  contents: read

env:
  SNAPSHOT: https://packagemanager.posit.co/cran/2026-10-09

jobs:
  units:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/hostedtoolcache || true
          sudo docker image prune -af || true
      - name: vec_rmeasure() with states that can be told apart
        run: |
          demo/01-pull.sh reference
          mkdir -p out src && chmod 777 out
          curl -fsSL -o src/spatPomp_1.1.0.tar.gz https://cloud.r-project.org/src/contrib/spatPomp_1.1.0.tar.gz
          docker run --rm --entrypoint bash -e SNAPSHOT -v "$PWD/out:/out" -v "$PWD/src:/pkgs:ro" \
            -v "$PWD/eval/retry/spatpomp-units.R:/units.R:ro" rcc-standalone:reference -c '
              mkdir -p /tmp/lib && export R_LIBS=/tmp/lib
              /build/bin/Rscript -e "
                options(repos = c(CRAN = Sys.getenv(\"SNAPSHOT\")), Ncpus = 4L)
                install.packages(c(\"pomp\", \"foreach\", \"dplyr\", \"tidyr\", \"stringr\", \"abind\", \"rlang\", \"ggplot2\"), lib = \"/tmp/lib\")
              " > /out/install.log 2>&1
              /build/bin/R CMD INSTALL -l /tmp/lib /pkgs/spatPomp_1.1.0.tar.gz >> /out/install.log 2>&1 ||
                { tail -n 40 /out/install.log; exit 1; }
              for i in 1 2 3; do
                /build/bin/Rscript --vanilla /units.R > "/out/units-$i.txt" 2>&1
                echo "run $i exited $?"
              done' || echo "the container exited $?"
      - name: summary
        if: always()
        run: |
          {
            echo '```'
            cat out/units-1.txt
            echo "--- the vec_rmeasure() result in runs 2 and 3"
            for i in 2 3; do sed -n '/^vec_rmeasure/,$p' "out/units-$i.txt"; done
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatPomp-units
          path: out
