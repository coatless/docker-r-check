name: evaluate

# One-off: blisfedora with Fedora's LAPACK, and postshock and fastPLS in mkl
# under each of MKL's code paths.
on:
  push:
    branches: [evaluate]

env:
  CRAN_MIRROR: https://packagemanager.posit.co/cran/2026-10-14
  RCC_MODE: regular
  RCC_LIBRARY_CACHE: "1"
  _R_CHECK_ELAPSED_TIMEOUT_: 3600

jobs:
  mkl:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5

      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup || true
          df -h /

      - name: pull mkl
        run: |
          docker pull --quiet ghcr.io/coatless/docker-r-check:mkl
          docker tag ghcr.io/coatless/docker-r-check:mkl rcc-standalone:mkl
          docker run --rm --entrypoint cat rcc-standalone:mkl /etc/rcheck/manifest.txt

      - name: check under each code path
        run: |
          cpu=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n 1)
          avx512=$(grep -qw avx512f /proc/cpuinfo && echo yes || echo no)
          settings="default MKL_CBWR=COMPATIBLE MKL_CBWR=AVX2"
          [ "$avx512" = no ] || settings="$settings MKL_CBWR=AVX512"
          case "$cpu" in *Intel*) settings="$settings MKL_ENABLE_INSTRUCTIONS=AVX2" ;; esac
          mkdir -p out
          for s in $settings; do
            ( [ "$s" = default ] || export "${s?}"
              demo/03-check.sh mkl postshock fastPLS > "out/$s.log" 2>&1 || true )
            for p in postshock fastPLS; do
              d="results/mkl/$p"
              st=$(grep -h '^Status' "$d/$p.Rcheck/00check.log" 2>/dev/null || echo "no status")
              code=$(sed -n 's/^MKL-Code: //p' "$d/manifest.dcf" 2>/dev/null)
              why=$(grep -h -m 1 -E '── (Failure|Error)' "$d/$p.Rcheck/tests/testthat.Rout.fail" 2>/dev/null || true)
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$cpu" "$avx512" "$s" "$p" "$st" "$code" "$why" | tee -a out/summary.tsv
            done
            cp -r results/mkl "out/results-$s"
          done
          { echo '```'; cat out/summary.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkl-${{ matrix.runner }}
          path: out

  blisfedora:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: add swap
        run: |
          sudo fallocate -l 16G /rcc-swap
          sudo chmod 600 /rcc-swap
          sudo mkswap /rcc-swap > /dev/null
          sudo swapon /rcc-swap

      - name: build
        run: |
          set -o pipefail
          docker build --progress=plain --platform linux/amd64 --target standalone \
            --build-arg DEBIAN_TAG=testing --build-arg RCC_FLAVOUR=blisfedora \
            --build-arg MAKEFLAGS=-j4 --build-arg BUILD_DATE="$(date -u +%Y-%m-%d)" \
            -t rcc-standalone:blisfedora docker/ 2>&1 | tail -n 300

      - name: what R loads
        run: |
          {
            echo '```'
            docker run --rm --entrypoint cat rcc-standalone:blisfedora /etc/rcheck/r-blas.txt
            docker run --rm --entrypoint /build/bin/R rcc-standalone:blisfedora --no-echo --vanilla -e '
              cat("BLAS   :", extSoftVersion()[["BLAS"]], "\n")
              cat("LAPACK :", La_library(), La_version(), "\n")
              set.seed(1); m <- crossprod(matrix(rnorm(1e4), 100))
              cat("chol ok:", isTRUE(all.equal(crossprod(chol(m)), m)), "\n")
              cat("svd d1 :", format(svd(m)$d[1], digits = 15), "\n")'
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: check the BLIS entries it reproduces
        env:
          BLIS_ARCH_TYPE: haswell
        run: |
          mkdir -p out
          demo/03-check.sh blisfedora ISwR micEconDistRay postshock WpProj > out/check.log 2>&1 || true
          {
            echo '```'
            sed -n 's/^CPU: /cpu: /p; s/^BLIS-Arch: /blis: /p' results/blisfedora/postshock/manifest.dcf
            for p in ISwR micEconDistRay postshock WpProj; do
              echo "$p: $(grep -h '^Status' "results/blisfedora/$p/$p.Rcheck/00check.log" 2>/dev/null || echo 'no status')"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cp -r results/blisfedora out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blisfedora
          path: out
