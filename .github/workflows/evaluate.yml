name: evaluate

# One-off: does gccsan's make check fail at r90704 because of ASan's fake stack?
on:
  push:
    branches: [evaluate]

jobs:
  gccsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        asan: ["detect_leaks=0", "detect_leaks=0:detect_stack_use_after_return=0"]
    steps:
      - uses: actions/checkout@v5

      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: add swap
        run: |
          sudo fallocate -l 16G /rcc-swap
          sudo chmod 600 /rcc-swap
          sudo mkswap /rcc-swap > /dev/null
          sudo swapon /rcc-swap

      - name: build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n 1
          docker build --progress=plain --platform linux/amd64 --target standalone \
            --build-arg DEBIAN_TAG=testing --build-arg RCC_FLAVOUR=gccsan \
            --build-arg R_SVN_REV=90704 --build-arg QA_SVN_REV=6980 \
            --build-arg RCC_ASAN_OPTIONS="${{ matrix.asan }}" \
            --build-arg MAKEFLAGS=-j4 --build-arg BUILD_DATE="$(date -u +%Y-%m-%d)" \
            -t rcc-standalone:gccsan docker/ 2>&1 | tail -n 60

      - name: stack figures under each setting
        if: steps.build.outcome == 'success'
        run: |
          {
            echo "build with ASAN_OPTIONS=${{ matrix.asan }}: ${{ steps.build.outcome }}"
            echo '```'
            docker run --rm -e ASAN_OPTIONS=help=1 --entrypoint /build/bin/R rcc-standalone:gccsan --version 2>&1 |
              grep -A1 -E '^\s*detect_stack_use_after_return' || true
            for opt in detect_leaks=0 detect_leaks=0:detect_stack_use_after_return=1 detect_leaks=0:detect_stack_use_after_return=0; do
              for _ in 1 2 3; do
                printf '%-50s ' "$opt"
                docker run --rm -e ASAN_OPTIONS="$opt" --entrypoint /build/bin/R rcc-standalone:gccsan \
                  --vanilla --no-echo -e 'f <- function(depth) if(depth < 20) f(depth+1) else Cstack_info()
                    z <- f(0); z10 <- f(10)
                    cat("z", z[2], " z10", z10[2], " z > z10:", z[2] > z10[2], "\n")' 2>&1 | tail -n 1
              done
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: outcome
        run: |
          echo "build with ASAN_OPTIONS=${{ matrix.asan }}: ${{ steps.build.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
