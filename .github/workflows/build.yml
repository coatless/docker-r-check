name: build

on:
  push:
    branches: [debian-blas-arms]
  workflow_dispatch:
    inputs:
      debian_tag:
        description: Debian suite for the base image
        default: trixie
      target:
        description: Dockerfile target to build
        default: base

permissions:
  contents: read

jobs:
  # Fast, and independent of whether the image builds at all.  Runs natively
  # amd64 inside the same suite the images use.
  wiring:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl ca-certificates binutils shellcheck

      - uses: actions/checkout@v5

      - name: lint
        run: |
          sh tests/lint-flavours.sh
          shellcheck -S warning docker/blas-wiring.sh docker/flavour-setup.sh

      - name: blas wiring
        run: bash tests/blas-wiring-test.sh

      - name: flavours
        run: |
          # The suite the arms target, with the pthread build present the way
          # the rcheckserver closure would supply it.
          apt-get install -y -qq libsuperlu-dev
          bash tests/flavour-test.sh

  # The open question: does the rcheckserver closure fit a GitHub runner?
  # Every step records df, so a failure is still a measurement.
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: disk before
        run: |
          echo "## disk before" >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"

      - name: reclaim disk
        run: |
          # Inline rather than a third-party action: this is a funded
          # infrastructure deliverable and the reclaim is four rm -rf calls.
          before=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          echo "reclaimed $((after - before)) GiB, now ${after} GiB free"
          {
            echo "## after reclaim"
            echo "reclaimed **$((after - before)) GiB**, now **${after} GiB** free"
          } >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY"

      - name: build
        id: build
        env:
          TAG: ${{ github.event.inputs.debian_tag || 'trixie' }}
          TARGET: ${{ github.event.inputs.target || 'base' }}
        run: |
          set -o pipefail
          cd docker
          docker build \
            --progress=plain \
            --build-arg DEBIAN_TAG="$TAG" \
            --target "$TARGET" \
            -t "rcc-$TARGET:$TAG" . 2>&1 | tail -400
          echo "built=1" >> "$GITHUB_OUTPUT"

      - name: measure
        if: always()
        env:
          TAG: ${{ github.event.inputs.debian_tag || 'trixie' }}
          TARGET: ${{ github.event.inputs.target || 'base' }}
        run: |
          {
            echo "## after build"
            df -h /
            echo ""
            echo "### image"
            docker images "rcc-$TARGET:$TAG" --format '{{.Repository}}:{{.Tag}}  {{.Size}}' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: contents of base
        if: steps.build.outputs.built == '1'
        env:
          TAG: ${{ github.event.inputs.debian_tag || 'trixie' }}
          TARGET: ${{ github.event.inputs.target || 'base' }}
        run: |
          img="rcc-$TARGET:$TAG"
          # tee, not >> : a measurement only in the job summary is not in the log,
          # and the log is what gets quoted later.
          {
            echo "## contents"
            echo "packages installed: $(docker run --rm "$img" sh -c "dpkg-query -f '.\n' -W | wc -l")"
            echo ""
            echo "### largest 20"
            docker run --rm "$img" sh -c \
              "dpkg-query -Wf '\${Installed-Size}\t\${Package}\n' | sort -rn | head -20"
            echo ""
            echo "### did the aasc.sources fixes take?"
            docker run --rm "$img" sh -c \
              "dpkg-query -W -f='rcheckserver \${Version}\n' rcheckserver 2>/dev/null || echo 'rcheckserver ABSENT'"
            docker run --rm "$img" sh -c \
              "dpkg-query -W -f='quarto \${Version}\n' quarto 2>/dev/null || echo 'quarto ABSENT -- non-free component missing'"
            echo ""
            echo "### texlive share"
            docker run --rm "$img" sh -c \
              "dpkg-query -Wf '\${Installed-Size}\t\${Package}\n' | grep -E 'texlive|context' | awk '{s+=\$1; n++} END {printf \"%d packages, %.2f GiB\\n\", n, s/1048576}'"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # Does an arm build end to end, with R inside, and is it running the BLAS it
  # says it is?  This is the first R build anywhere in this project.
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        flavour: [reference, openblas]
    steps:
      - uses: actions/checkout@v5

      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: build
        id: build
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          set -o pipefail
          cd docker
          docker build \
            --progress=plain \
            --build-arg DEBIAN_TAG=trixie \
            --build-arg RCC_FLAVOUR="$FLAVOUR" \
            --build-arg R_SVN_REV=90410 \
            --build-arg QA_SVN_REV=6927 \
            --build-arg MAKEFLAGS=-j4 \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target standalone \
            -t "rcc-standalone:$FLAVOUR" . 2>&1 | tail -300
          echo "built=1" >> "$GITHUB_OUTPUT"

      - name: what did we actually get
        if: steps.build.outputs.built == '1'
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          img="rcc-standalone:$FLAVOUR"
          {
            echo "## $FLAVOUR"
            echo '```'
            docker run --rm --entrypoint sh "$img" -c 'cat /etc/rcheck/manifest.txt'
            echo '```'
            echo "### R sees"
            echo '```'
            docker run --rm --entrypoint /build/bin/R "$img" --no-echo --vanilla -e '
              cat("R          :", R.version.string, "\n")
              cat("svn rev    :", R.version$"svn rev", "\n")
              cat("BLAS       :", extSoftVersion()[["BLAS"]], "\n")
              cat("LAPACK     :", La_library(), La_version(), "\n")
              set.seed(1); m <- crossprod(matrix(rnorm(1e4), 100))
              cat("chol ok    :", isTRUE(all.equal(crossprod(chol(m)), m)), "\n")
              cat("svd d[1]   :", format(svd(m)$d[1], digits = 15), "\n")
              cat("det        :", format(determinant(m)$modulus, digits = 15), "\n")'
            echo '```'
            echo "### image size"
            docker images "$img" --format '{{.Size}}'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: R CMD check a real package
        if: steps.build.outputs.built == '1'
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          # Smallest useful end-to-end proof: the image can check a package
          # with compiled code without a host-mounted R.
          # Resolve the current version from PACKAGES: CRAN's src/contrib only
          # serves the newest, so any hardcoded filename 404s the moment the
          # package is updated.
          mkdir -p pkg
          for p in digest jsonlite; do
            v=$(curl -fsSL https://cloud.r-project.org/src/contrib/PACKAGES \
                | awk -v p="$p" '$0=="Package: "p{f=1;next} f&&/^Version:/{print $2;exit}')
            [ -n "$v" ] || { echo "could not resolve a version for $p" >&2; exit 1; }
            echo "fetching ${p}_${v}.tar.gz"
            curl -fsSL -o "pkg/${p}_${v}.tar.gz" \
              "https://cloud.r-project.org/src/contrib/${p}_${v}.tar.gz"
          done
          ls -l pkg/
          # Capture first, filter second, and assert the check actually ran.
          # Piping docker straight into grep|tail makes the step's exit status
          # tail's, so a container that never started reports success with an
          # empty log -- which is exactly what happened the first time.
          # Build the argument list from the HOST directory and pass explicit
          # names.  A /pkg/*.tar.gz glob is expanded by the host shell, where
          # /pkg does not exist, so R receives the literal pattern -- and then
          # exits 0 after merely warning that it skipped everything.
          set --
          for t in pkg/*.tar.gz; do set -- "$@" "/pkg/$(basename "$t")"; done
          echo "checking: $*"

          rc=0
          docker run --rm -v "$PWD/pkg:/pkg:ro" -w /tmp \
            --entrypoint /build/bin/R "rcc-standalone:$FLAVOUR" \
            CMD check --no-manual --no-vignettes "$@" > check.log 2>&1 || rc=$?
          echo "R CMD check exit: $rc"

          if ! grep -q '^Status' check.log; then
            echo "** no Status line: R CMD check did not run to completion" >&2
            echo "---- full output ----" >&2
            cat check.log >&2
            exit 1
          fi

          # rc=1 means the PACKAGE was not clean, which is a fact about the
          # package and not a fault in the image.  The gate is that a check ran
          # to completion at all, which the Status assertion above covers.
          {
            echo "### R CMD check ($FLAVOUR) -- exit $rc"
            echo '```'
            grep -E '^\*|^Status' check.log | head -60
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            echo "---- full check log ----"
            cat check.log
          fi
