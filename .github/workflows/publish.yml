name: publish

# Build every arm from scratch and push it to GitHub's container registry as
# ghcr.io/<owner>/<repository>:<arm>. Each image is also tagged
# <arm>-<date> and <arm>-r<R revision>, so that one build can be named later.
#
# The Dockerfile's base, Debian with rcheckserver, is built once and pushed
# as base and base-<date>. The arms for x86 are built on that image, so they
# have the same Debian packages and share its layers in the registry. The
# arm64 arm builds its own base, for its own architecture.
#
# A run starts every day and builds on Debian testing, with the newest
# R-devel and QA revisions. It then starts the evaluate workflow on the new
# images and deletes images that are older than KEEP_DAYS.
#
# A run started by hand, from the Actions page or with
# `gh workflow run publish.yml`, can build on Debian stable. Those images are
# tagged <arm>-stable, <arm>-stable-<date> and <arm>-stable-r<R revision>,
# and the base base-stable and base-stable-<date>.

on:
  # GitHub starts a scheduled run from the default branch only, and often
  # hours after the time given here.
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      arms:
        description: Arms to publish, as a list such as "openblas mkl". Empty publishes every arm.
      suite:
        description: Debian suite to build on
        type: choice
        options: [testing, stable]
        default: testing
      r_rev:
        description: R-devel SVN revision to build. Empty takes the newest.
      qa_rev:
        description: QA tree SVN revision. Empty takes the newest.
      keep_days:
        description: Delete images older than this many days. "default" takes the repository variable RCC_KEEP_DAYS, or 30.
        type: choice
        options: [default, "30", "60", "90", never]
        default: default
      evaluate:
        description: Start the evaluate workflow on the new images, as the daily run does
        type: boolean
        default: false

permissions:
  contents: read

# One publish run for a suite at a time, so two runs do not move the same
# tags in turn.
concurrency:
  group: publish-${{ inputs.suite || 'testing' }}
  cancel-in-progress: false

env:
  SUITE: ${{ inputs.suite || 'testing' }}
  # How long an image is kept, in days: 30, 60, 90 or never.
  KEEP_DAYS: ${{ (inputs.keep_days != 'default' && inputs.keep_days) || vars.RCC_KEEP_DAYS || '30' }}

jobs:
  # One R revision, one QA revision and one date for every arm of the run.
  pin:
    runs-on: ubuntu-24.04
    outputs:
      r_rev: ${{ steps.pin.outputs.r_rev }}
      qa_rev: ${{ steps.pin.outputs.qa_rev }}
      date: ${{ steps.pin.outputs.date }}
      arms: ${{ steps.arms.outputs.arms }}
      base: ${{ steps.arms.outputs.base }}
    steps:
      - uses: actions/checkout@v5

      - name: pin the revisions
        id: pin
        env:
          IN_R: ${{ inputs.r_rev }}
          IN_QA: ${{ inputs.qa_rev }}
        run: |
          newest() { curl -fsSL "$1" | sed -n 's/.*Revision \([0-9][0-9]*\).*/\1/p' | head -n 1; }
          r_rev=${IN_R:-$(newest https://svn.r-project.org/R/trunk/)}
          qa_rev=${IN_QA:-$(newest https://svn.r-project.org/R-dev-web/trunk/CRAN/QA/Kurt/)}
          [ -n "$r_rev" ] && [ -n "$qa_rev" ]
          {
            echo "r_rev=$r_rev"
            echo "qa_rev=$qa_rev"
            echo "date=$(date -u +%Y-%m-%d)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: choose the arms
        id: arms
        env:
          IN_ARMS: ${{ inputs.arms }}
        run: |
          # Every arm that builds on this suite, or the ones asked for. The
          # base is built when one of them is for x86.
          arms=""
          base=false
          for f in docker/flavours/*.env; do
            arm=$(basename "$f" .env)
            # shellcheck disable=SC1090 # the arm file names its suites
            suites=$(. "$f" && echo "${RCC_SUITES:-testing stable}")
            case " $suites " in *" $SUITE "*) ;; *) echo "$arm does not build on $SUITE"; continue ;; esac
            case " ${IN_ARMS//[^a-z0-9]/ } " in "  "|*" $arm "*) ;; *) continue ;; esac
            arms="$arms $arm"
            # shellcheck disable=SC1090
            [ "$(. "$f" && echo "$RCC_ARCH")" != amd64 ] || base=true
          done
          [ -n "$arms" ] || { echo "no arm to build"; exit 1; }
          # shellcheck disable=SC2086 # the list is split on purpose
          echo "arms=$(printf '%s\n' $arms | jq -R . | jq -cs .)" | tee -a "$GITHUB_OUTPUT"
          echo "base=$base" | tee -a "$GITHUB_OUTPUT"

  # The base for the arms on x86, pushed once. The arms build on it by its
  # digest, so they all get this image even if the tag moves.
  base:
    needs: pin
    if: needs.pin.outputs.base == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      DATE: ${{ needs.pin.outputs.date }}
    steps:
      - uses: actions/checkout@v5

      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: add swap
        run: |
          # Exporting the base takes most of a runner's memory too.
          sudo fallocate -l 16G /rcc-swap
          sudo chmod 600 /rcc-swap
          sudo mkswap /rcc-swap > /dev/null
          sudo swapon /rcc-swap
          free -h

      - name: build the base
        run: |
          set -o pipefail
          # The arms set these labels again, so none of the base's is left
          # on an arm with a wrong value.
          docker build --progress=plain --platform linux/amd64 --target base \
            --build-arg DEBIAN_TAG="$SUITE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.description=Debian $SUITE with rcheckserver, the base of the arms for CRAN's additional checks" \
            --label "rcheck.suite=$SUITE" --label "rcheck.built=$DATE" \
            -t rcc-base docker/ 2>&1 | tail -n 300
          {
            echo "## base on Debian $SUITE"
            echo '```'
            docker run --rm rcc-base dpkg-query -W -f='rcheckserver ${Version}\n' rcheckserver
            echo "packages: $(docker run --rm rcc-base sh -c "dpkg-query -f '.\n' -W | wc -l")"
            echo "size on disk: $(docker images rcc-base --format '{{.Size}}')"
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          name=base; [ "$SUITE" = testing ] || name="base-$SUITE"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$name-$DATE" "$name"; do
            docker tag rcc-base "$repo:$tag"
            docker push --quiet "$repo:$tag"
          done
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$repo:$name")
          case "$image" in "$repo@sha256:"*) ;; *) echo "no digest for $repo:$name: $image"; exit 1 ;; esac
          echo "image=$image" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### pushed"
            echo '```'
            echo "$repo:$name"
            echo "$repo:$name-$DATE"
            echo "$image"
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    needs: [pin, base]
    # The arm64 arm does not need the base, so it runs when the base did not
    # build. An arm for x86 then stops in its build step.
    if: ${{ !cancelled() && needs.pin.result == 'success' }}
    # The arm64 arm builds on an arm64 runner, the others on x86.
    runs-on: ${{ matrix.arm == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # GitHub gives up on a job that has not got a runner after 15 minutes,
      # so do not ask for more runners at once than it hands out.
      max-parallel: 8
      matrix:
        arm: ${{ fromJSON(needs.pin.outputs.arms) }}
    env:
      ARM: ${{ matrix.arm }}
      R_REV: ${{ needs.pin.outputs.r_rev }}
      QA_REV: ${{ needs.pin.outputs.qa_rev }}
      DATE: ${{ needs.pin.outputs.date }}
      BASE: ${{ needs.base.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: add swap
        run: |
          # Exporting the finished image takes about 15 GiB of memory, which is
          # all a runner has. Without more swap the runner is shut down.
          sudo fallocate -l 16G /rcc-swap
          sudo chmod 600 /rcc-swap
          sudo mkswap /rcc-swap > /dev/null
          sudo swapon /rcc-swap
          free -h

      - name: build the arm
        run: |
          set -o pipefail
          # Every job downloads the same sources. Do not start them all in
          # the same second.
          sleep $((RANDOM % 90))
          # shellcheck disable=SC1090 # the arm file names its architecture
          arch=$(. "docker/flavours/$ARM.env" && echo "$RCC_ARCH")
          # An arm for x86 takes the Dockerfile's base stage from the image
          # the base job pushed. The base refuses to build for anything but
          # amd64 unless told to.
          base=()
          if [ "$arch" = amd64 ]; then
            [ -n "$BASE" ] || { echo "the base image did not build, so this arm is not built"; exit 1; }
            docker pull --quiet "$BASE"
            base=(--build-context "base=docker-image://$BASE"
                  --label "org.opencontainers.image.base.name=$BASE"
                  --label "org.opencontainers.image.base.digest=${BASE#*@}")
          fi
          # The source label is what ties the image to this repository, and
          # the evaluate workflow reads the revisions and the suite from the
          # other labels.
          docker build --progress=plain --platform "linux/$arch" --target standalone \
            "${base[@]}" \
            --build-arg ALLOW_NON_AMD64="$([ "$arch" = amd64 ] || echo 1)" \
            --build-arg DEBIAN_TAG="$SUITE" --build-arg RCC_FLAVOUR="$ARM" \
            --build-arg R_SVN_REV="$R_REV" --build-arg QA_SVN_REV="$QA_REV" \
            --build-arg MAKEFLAGS=-j4 --build-arg BUILD_DATE="$DATE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=r$R_REV" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.description=R-devel r$R_REV on Debian $SUITE with rcheckserver, the $ARM arm for CRAN's additional checks" \
            --label "rcheck.arm=$ARM" --label "rcheck.suite=$SUITE" \
            --label "rcheck.r-svn-rev=$R_REV" --label "rcheck.qa-svn-rev=$QA_REV" \
            --label "rcheck.built=$DATE" \
            -t "rcc-standalone:$ARM" docker/ 2>&1 | tail -n 300
          if [ "$arch" = amd64 ]; then
            # The arm's first layers are the base's, or it was not built on it.
            docker image inspect --format '{{json .RootFS.Layers}}' "$BASE" "rcc-standalone:$ARM" \
              | jq -se '.[1][:(.[0] | length)] == .[0]' > /dev/null \
              || { echo "rcc-standalone:$ARM is not built on $BASE"; exit 1; }
          fi

      - name: what the image holds
        run: |
          img="rcc-standalone:$ARM"
          {
            echo "## $ARM on Debian $SUITE"
            echo '```'
            docker run --rm --entrypoint cat "$img" /etc/rcheck/manifest.txt
            echo "size on disk: $(docker images "$img" --format '{{.Size}}')"
            echo '```'
            echo "### packages from Debian's contrib and non-free sections"
            echo '```'
            docker run --rm --entrypoint sh "$img" -c \
              "dpkg-query -W -f='\${Section}\t\${Package}\n' | grep -E '^(contrib|non-free)' | sort" || echo none
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: keep Intel's license notices with MKL
        if: matrix.arm == 'mkl'
        run: |
          # Intel's license lets the MKL libraries be passed on only together
          # with its notices, so an image without them is not pushed.
          n=$(docker run --rm --entrypoint sh "rcc-standalone:$ARM" -c \
            "find /opt/intel -type f -ipath '*licensing*' | tee /dev/stderr | wc -l")
          [ "$n" -gt 0 ] || { echo "Intel's license notices are not in the image"; exit 1; }

      - name: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          name="$ARM"; [ "$SUITE" = testing ] || name="$ARM-$SUITE"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The dated tags go first. The tag the evaluation and 01-pull.sh
          # use moves last, once the others are in place.
          for tag in "$name-$DATE" "$name-r$R_REV" "$name"; do
            docker tag "rcc-standalone:$ARM" "$repo:$tag"
            docker push --quiet "$repo:$tag"
          done
          {
            echo "### pushed"
            echo '```'
            echo "$repo:$name"
            echo "$repo:$name-$DATE"
            echo "$repo:$name-r$R_REV"
            docker manifest inspect "$repo:$name" | python3 -c 'import json, sys
          m = json.load(sys.stdin)
          print("download size: %.1f GB" % (sum(l["size"] for l in m.get("layers", [])) / 1e9))' || true
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # Delete images older than KEEP_DAYS. The image an arm's own tag points at
  # is always kept, however old it is.
  prune:
    needs: [pin, image]
    if: always() && needs.pin.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: delete old images
        env:
          GH_TOKEN: ${{ github.token }}
        run: eval/prune.sh "$KEEP_DAYS"

  # The daily run goes on to compare the new images with CRAN's results.
  evaluate:
    needs: [pin, image]
    if: always() && needs.pin.result == 'success' && (github.event_name == 'schedule' || inputs.evaluate)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: start the evaluate workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . eval/run.env
          # Only the results on Debian testing go into README.md.
          readme=false; [ "$SUITE" != testing ] || readme=true
          gh workflow run evaluate.yml --ref "$GITHUB_REF_NAME" \
            -f kinds="$DAILY_KINDS" -f images=published -f suite="$SUITE" -f readme="$readme"
